name: PICKUP diario

on:
  schedule:
    - cron: "5 10 * * *" # 07:05 BRT (UTC-3, sem horario de verao) -- fora da hora cheia p/ evitar congestionamento de crons no GH Actions
  workflow_dispatch: {} # permite disparo manual

permissions:
  contents: write # precisa pra commitar o historico/output de volta no repo

jobs:
  pickup-diario:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python extrair_pickup.py
        env:
          JMS_TOKEN_INDICADORES: ${{ secrets.JMS_TOKEN_INDICADORES }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO_PICKUP: ${{ secrets.EMAIL_TO_PICKUP }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL: ${{ secrets.DB_SSL }}
      # PICKUP e DROPOFF rodam no mesmo horario (07:05) e podem terminar
      # essa etapa quase juntos -- se um empurrar primeiro, o outro toma
      # "rejected (fetch first)". Faz rebase e tenta de novo (ate 5x) em
      # vez de falhar o job so por causa dessa corrida.
      - name: Salvar historico e planilhas de volta no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados/ output/
          git diff --cached --quiet && { echo "Nada novo pra commitar."; exit 0; }
          git commit -m "Atualiza historico e planilhas PICKUP (run automatico)"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejeitado (tentativa $i), rebasando e tentando de novo..."
            git pull --rebase origin master
          done
          git push
