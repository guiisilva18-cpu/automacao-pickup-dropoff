name: RESUMO FEISHU diario

on:
  # Gatilho principal: rotina agendada do Claude Code (nuvem) "Disparo RESUMO
  # FEISHU 08:30 BRT", via workflow_dispatch -- o schedule nativo do GitHub
  # atrasa horas, entao ele fica so como rede de seguranca (mesma cron: se a
  # rotina falhar, o nativo manda mais tarde; o lock no banco -- tabela
  # resumo_feishu_envio -- garante 1 envio por dia, nunca duplica).
  schedule:
    - cron: "30 11 * * *" # 08:30 BRT
  workflow_dispatch:
    inputs:
      force:
        description: "Reenviar mesmo que o resumo de hoje ja tenha sido enviado"
        type: boolean
        default: false
      dry_run:
        description: "So gerar os prints/cartoes (ficam nos artifacts), sem enviar nada"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: resumo-feishu
  cancel-in-progress: false

jobs:
  resumo-feishu:
    runs-on: ubuntu-latest
    # espera o fechamento de D-1 no JMS (ate ~50 min) + coleta e envio
    timeout-minutes: 90
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Fonte chinesa pros cabecalhos bilingues dos prints (modo imagem).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - run: pip install -r requirements-bot.txt
      - run: python bot_feishu.py ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.force && '--force' || '' }}
        env:
          JMS_TOKEN_INDICADORES: ${{ secrets.JMS_TOKEN_INDICADORES }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL: ${{ secrets.DB_SSL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_KEYWORD: ${{ secrets.FEISHU_KEYWORD }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_DESTINO: ${{ secrets.FEISHU_DESTINO }}
          FEISHU_DESTINO_TIPO: ${{ secrets.FEISHU_DESTINO_TIPO }}
          FEISHU_BASE_URL: ${{ secrets.FEISHU_BASE_URL }}
          FEISHU_MODO: ${{ secrets.FEISHU_MODO }}
      - uses: actions/upload-artifact@v4
        if: inputs.dry_run
        with:
          name: prints-resumo
          path: saida_bot/
