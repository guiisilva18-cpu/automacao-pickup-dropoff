name: TRANSFERENCIA diario

on:
  schedule:
    - cron: "0 11 * * *" # 08:00 BRT (UTC-3, sem horario de verao) -- pedido do Guilherme, 14/09/2026 ("mudar pra 08:00
    # pra gerar os email"). ATENCAO: antes rodava as 09:00 BRT de proposito -- as 05:05 BRT (junto com PICKUP/DROPOFF)
    # o endpoint de Indicadores de Negocios (bigdataReport) ainda nao tinha fechado as estatisticas do dia anterior e
    # saia tudo zerado (descoberto 03/09/2026: mesma chamada, mesma janela de data, retornando 0 as 05h e dado real as
    # 09h). Voltar pra 08:00 e 1h mais cedo que o horario ja validado -- se o email sair zerado de novo, e esse o motivo
    # mais provavel (voltar pra "0 12 * * *" = 09:00 BRT resolve).
  workflow_dispatch: {} # permite disparo manual

permissions:
  contents: write # precisa pra commitar a planilha de volta no repo

jobs:
  transferencia-diario:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python extrair_transferencia.py
        env:
          JMS_TOKEN_INDICADORES: ${{ secrets.JMS_TOKEN_INDICADORES }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO_TRANSFERENCIA: ${{ secrets.EMAIL_TO_TRANSFERENCIA }}
      - name: Salvar planilha de volta no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet && { echo "Nada novo pra commitar."; exit 0; }
          git commit -m "Atualiza planilha TRANSFERENCIA (run automatico)"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejeitado (tentativa $i), rebasando e tentando de novo..."
            git pull --rebase origin master
          done
          git push
