name: DROPOFF diario

on:
  schedule:
    - cron: "30 11 * * *" # 08:30 BRT (UTC-3, sem horario de verao)
  workflow_dispatch: {} # permite disparo manual

jobs:
  dropoff-diario:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python extrair_dropoff.py
        env:
          JMS_TOKEN_INDICADORES: ${{ secrets.JMS_TOKEN_INDICADORES }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO_DROPOFF: ${{ secrets.EMAIL_TO_DROPOFF }}
